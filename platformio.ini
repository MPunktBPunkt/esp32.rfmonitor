[platformio]
default_envs = rfmonitor-mini
src_dir = src

; Shared firmware settings (not inherited by native).
[firmware]
platform = espressif32@6.4.0
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.2.1
  h2zero/NimBLE-Arduino@^1.4.3
build_flags =
  -DFW_VERSION=\"1.10.2\"
  -DHUB_HOST_DEFAULT=\"192.168.178.113\"
  -DHUB_PORT_DEFAULT=8093
  -DCORE_DEBUG_LEVEL=0
  -I include
  -I src

; Mini D1: dual-core ESP32, typically no PSRAM — small internal buffers.
; min_spiffs: larger app slot so NimBLE + UI still fit OTA (default is too tight).
; Dual-core RF worker OFF on Mini: NimBLE init on Arduino core + scan on core0
; left BLE windows hung (bleScanning stuck), which starved WiFi scans.
[env:rfmonitor-mini]
extends = firmware
board = wemos_d1_mini32
board_build.partitions = min_spiffs.csv
build_flags =
  ${firmware.build_flags}
  -DRFMON_BOARD_MINI=1
  -DRFMON_HISTORY_SIZE=72
  -DRFMON_ENABLE_BLE=1
  -DRFMON_USE_DUAL_CORE=0
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

; S3 DevKitC-1 N8R2 (Lab .88): Quad Flash + Quad PSRAM → qio_qspi (nicht qio_opi/N8R8).
[env:rfmonitor-s3]
extends = firmware
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
build_flags =
  ${firmware.build_flags}
  -DRFMON_BOARD_S3=1
  -DRFMON_HISTORY_SIZE=180
  -DRFMON_ENABLE_BLE=1
  -DRFMON_USE_DUAL_CORE=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0

; Host unit tests for pure RfScore (no Arduino).
[env:native]
platform = native
build_flags =
  -std=gnu++17
  -I include
  -I src
build_src_filter = +<rf/RfScore.cpp>
test_build_src = yes
test_filter = test_score
