[platformio]
default_envs = rfmonitor-mini
src_dir = src

[env]
platform = espressif32@6.4.0
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.2.1
  h2zero/NimBLE-Arduino@^1.4.3
build_flags =
  -DFW_VERSION=\"1.0.0\"
  -DHUB_HOST_DEFAULT=\"192.168.178.113\"
  -DHUB_PORT_DEFAULT=8093
  -DCORE_DEBUG_LEVEL=0
  -I include
  -I src

[env:rfmonitor-mini]
board = wemos_d1_mini32
build_flags =
  ${env.build_flags}
  -DRFMON_BOARD_MINI=1
  -DRFMON_HISTORY_SIZE=72
  -DRFMON_ENABLE_BLE=1

[env:rfmonitor-s3]
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -DRFMON_BOARD_S3=1
  -DRFMON_HISTORY_SIZE=180
  -DRFMON_ENABLE_BLE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
